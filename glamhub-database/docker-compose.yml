name: glamhub-database
services:
  glamhub-db:
    image: postgres:16-alpine
    container_name: glamhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: glamhub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5440:5432"
    volumes:
      - glamhub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d glamhub"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  glamhub_pgdata:
